<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn — World Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  .app { position: relative; height: 100%; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; }

  /* ---------- the scene ---------- */
  .scene { position: relative; height: 540px; flex: none; overflow: hidden; }
  .sky { position: absolute; inset: 0; }
  .stars { position: absolute; inset: 0 0 40% 0; background-image: radial-gradient(1.4px 1.4px at 20px 30px, #fff 50%, transparent 51%), radial-gradient(1px 1px at 90px 80px, #fff 50%, transparent 51%), radial-gradient(1.8px 1.8px at 150px 20px, #fff 50%, transparent 51%), radial-gradient(1px 1px at 200px 120px, #fff 50%, transparent 51%), radial-gradient(1.2px 1.2px at 60px 150px, #fff 50%, transparent 51%); background-size: 230px 180px; opacity: 0; }
  .orb { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; }
  .layer { position: absolute; left: 0; top: 0; height: 100%; will-change: transform; }
  .layer svg { display: block; height: 100%; }
  .track-wrap { position: absolute; inset: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; -webkit-overflow-scrolling: touch; cursor: grab; }
  .track-wrap::-webkit-scrollbar { display: none; }
  .track { position: relative; height: 100%; }
  .track > svg { position: absolute; left: 0; top: 0; height: 100%; }

  /* signposts */
  .post { position: absolute; top: 278px; width: 74px; margin-left: -37px; display: flex; flex-direction: column; align-items: center; z-index: 3; }
  .board { position: relative; width: 70px; height: 54px; border-radius: 14px; background: #fff; display: grid; place-items: center; font-size: 28px; box-shadow: 0 4px 0 rgba(0, 0, 0, .25); transition: transform .12s; }
  .post:active .board { transform: translateY(3px); }
  .board .n { position: absolute; left: -8px; top: -8px; min-width: 24px; height: 24px; padding: 0 5px; border-radius: 99px; background: var(--paper-ink); color: #fff; font: 800 13px/24px var(--display); text-align: center; }
  .pole { width: 6px; height: 64px; background: linear-gradient(90deg, #6b6488, #4a4466); border-radius: 0 0 3px 3px; }
  .post .stars { position: absolute; top: 60px; background: rgba(20, 16, 40, .55); padding: 2px 5px; border-radius: 99px; }
  .post .stars i { width: 12px; height: 12px; }
  .post.done .board .n { background: var(--mint-d); }
  .post.current .board { background: var(--yellow); box-shadow: 0 4px 0 var(--yellow-d), 0 0 0 0 rgba(255, 210, 63, .7); animation: beacon 1.8s ease-out infinite; }
  @keyframes beacon { to { box-shadow: 0 4px 0 var(--yellow-d), 0 0 0 16px rgba(255, 210, 63, 0); } }
  .post.locked .board { background: rgba(236, 233, 245, .9); font-size: 22px; }
  .post.locked .board > span { filter: grayscale(1); opacity: .55; }
  .post.sel .board { outline: 4px solid #fff; outline-offset: 3px; }
  .post .flag { position: absolute; top: -26px; padding: 3px 8px; border-radius: 8px; background: var(--paper-ink); color: var(--yellow); font: 800 11px var(--body); letter-spacing: .1em; }

  /* venues (chapter trophies) */
  .venue { position: absolute; top: 236px; width: 132px; margin-left: -66px; height: 170px; z-index: 2; }
  .venue svg { width: 100%; height: 100%; overflow: visible; }
  .venue.sel { filter: drop-shadow(0 0 10px rgba(255, 255, 255, .8)); }
  .bulb { animation: bulb 1s steps(2) infinite; }
  @keyframes bulb { 50% { opacity: .25; } }

  /* the tour van */
  .van { position: absolute; top: 382px; width: 92px; height: 54px; margin-left: -46px; z-index: 4; animation: bounce .5s ease-in-out infinite alternate; }
  .van svg { width: 100%; height: 100%; overflow: visible; }
  @keyframes bounce { to { transform: translateY(-2px); } }
  .puff { position: absolute; left: -6px; top: 36px; width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 255, 255, .7); animation: puff 1.6s ease-out infinite; }
  .puff + .puff { animation-delay: .8s; }
  @keyframes puff { from { transform: translate(0, 0) scale(.5); opacity: .9; } to { transform: translate(-26px, -12px) scale(1.8); opacity: 0; } }

  /* HUD over the scene */
  .hud { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 10; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
  .ticket { pointer-events: auto; position: relative; display: flex; align-items: stretch; border-radius: 14px; background: var(--paper); color: var(--paper-ink); box-shadow: 0 6px 18px rgba(0, 0, 0, .25); overflow: hidden; }
  .ticket .a { padding: 8px 12px; border-right: 2px dashed #d8cfb5; display: grid; place-items: center; font-size: 22px; }
  .ticket .b { padding: 7px 14px 8px 12px; }
  .ticket .k { font: 800 10px var(--body); letter-spacing: .14em; text-transform: uppercase; color: #9a8f6b; }
  .ticket b { display: block; font: 800 16px var(--display); }
  .chips { display: flex; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 11px; border-radius: 99px; background: rgba(21, 18, 43, .72); color: #fff; font: 800 14px var(--display); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }

  /* ---------- panel under the scene ---------- */
  .panel { flex: 1; position: relative; margin-top: -26px; z-index: 6; border-radius: 26px 26px 0 0; background: var(--bg); padding: 16px 16px 100px; box-shadow: 0 -10px 30px rgba(0, 0, 0, .3); overflow-y: auto; }
  .legs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 14px; padding: 0 16px; }
  .legs::-webkit-scrollbar { display: none; }
  .leg { flex: none; display: flex; align-items: center; gap: 6px; padding: 7px 11px 7px 8px; border-radius: 99px; border: 2px solid var(--line); background: var(--card); font: 700 13px var(--body); color: var(--mute); white-space: nowrap; }
  .leg span { font-size: 16px; }
  .leg.done { color: var(--ink); }
  .leg.done::after { content: '✓'; color: var(--mint); font-weight: 800; }
  .leg.locked { opacity: .55; }
  .leg.on { border-color: var(--yellow); color: var(--ink); background: var(--card-2); }
  .card { display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 20px; background: var(--card); border: 2px solid var(--line); }
  .card .ic { flex: none; width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; font-size: 30px; background: var(--card-2); }
  .card .t { flex: 1; min-width: 0; }
  .card .k { font: 700 11px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
  .card h2 { font-size: 20px; margin: 3px 0 4px; }
  .card .m { display: flex; align-items: center; gap: 8px; color: var(--mute); font-size: 13px; font-weight: 500; }
  .go { display: block; width: 100%; margin-top: 12px; padding: 15px; border-radius: 16px; background: var(--yellow); color: #2a1f00; font: 800 18px var(--display); box-shadow: 0 5px 0 var(--yellow-d); }
  .go:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--yellow-d); }
  .go:disabled { background: var(--card-2); color: var(--mute); box-shadow: 0 5px 0 #120f22; }
  .go.alt { background: var(--card-2); color: var(--ink); box-shadow: 0 5px 0 #120f22; }

  /* ---------- weather ---------- */
  .wx { position: absolute; top: 0; height: 100%; overflow: hidden; pointer-events: none; z-index: 5; }
  .mist { position: absolute; left: -10%; right: -10%; top: 46%; height: 18%; background: radial-gradient(closest-side, rgba(255, 240, 245, .75), transparent); animation: drift 10s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translateX(8%); } }
  .rain { position: absolute; inset: -10% 0 0; background-image: repeating-linear-gradient(105deg, transparent 0 14px, rgba(220, 232, 255, .4) 14px 15px, transparent 15px 31px); background-size: 100% 90px; animation: pour .45s linear infinite; }
  .rain.b { opacity: .5; background-size: 100% 60px; animation-duration: .32s; }
  @keyframes pour { to { background-position: -24px 90px; } }
  .snow { position: absolute; inset: 0; background-image: radial-gradient(3px 3px at 20px 30px, #fff 50%, transparent 51%), radial-gradient(2px 2px at 80px 70px, #fff 50%, transparent 51%), radial-gradient(4px 4px at 130px 20px, #fff 50%, transparent 51%), radial-gradient(2.5px 2.5px at 170px 110px, #fff 50%, transparent 51%); background-size: 190px 160px; animation: snow 8s linear infinite; }
  .snow.b { background-size: 260px 230px; animation-duration: 13s; opacity: .7; }
  @keyframes snow { to { background-position: 60px 160px; } }
  .fly { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #e9ff8a; box-shadow: 0 0 8px 3px rgba(233, 255, 138, .6); animation: firefly 5s ease-in-out infinite alternate; }
  @keyframes firefly { 0% { transform: translate(0, 0); opacity: .2; } 50% { opacity: 1; } 100% { transform: translate(24px, -18px); opacity: .3; } }
  .boom { position: absolute; width: 6px; height: 6px; border-radius: 50%; animation: boom 2.6s ease-out infinite; }
  @keyframes boom { 0% { transform: scale(.2); opacity: 0; } 10% { opacity: 1; } 70% { transform: scale(1); opacity: .9; } 100% { transform: scale(1.1) translateY(10px); opacity: 0; } }
  .weed { position: absolute; top: 412px; width: 22px; height: 22px; border: 2px dotted #a77a45; border-radius: 50%; animation: roll 7s linear infinite; }
  @keyframes roll { from { transform: translateX(-40px) rotate(0); } to { transform: translateX(860px) rotate(1080deg); } }
  .haze { position: absolute; left: 0; right: 0; top: 50%; height: 14%; background: linear-gradient(transparent, rgba(255, 220, 150, .4), transparent); animation: shim 2.5s ease-in-out infinite alternate; }
  @keyframes shim { to { transform: scaleY(1.4); opacity: .5; } }
  .gull { position: absolute; width: 18px; height: 8px; animation: glide 14s linear infinite; }
  @keyframes glide { from { transform: translateX(-40px); } to { transform: translateX(880px); } }
  .spin { animation: spin 6s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sweep { animation: sweep 4s ease-in-out infinite alternate; transform-box: view-box; }
  @keyframes sweep { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
  .blink { animation: bulb 1.4s steps(2) infinite; }
  .beam { animation: beam 3s ease-in-out infinite; transform-box: view-box; }
  @keyframes beam { 0%, 100% { opacity: .1; } 50% { opacity: .55; } }
  .smoke { animation: smoke 4s ease-out infinite; transform-box: fill-box; }
  @keyframes smoke { from { transform: translate(0, 0) scale(.6); opacity: .8; } to { transform: translate(8px, -26px) scale(1.4); opacity: 0; } }
  .cloudmove { animation: cmove 30s linear infinite alternate; }
  @keyframes cmove { to { transform: translateX(120px); } }
</style>
</head>
<body>
<div class="app">
  <div class="scene" id="scene">
    <div class="sky" id="sky"><div class="stars" id="stars"></div><div class="orb" id="orb"></div></div>
    <div class="layer" id="far"></div>
    <div class="layer" id="mid"></div>
    <div class="track-wrap" id="wrap"><div class="track" id="track"></div></div>
    <div class="hud">
      <div class="ticket"><div class="a" id="tkE">🎫</div><div class="b"><div class="k" id="tkK">World tour · Leg 3 of 8</div><b id="tkT">Lighthouse Coast</b></div></div>
      <div class="chips"><span class="chip">🔥 12</span><span class="chip" id="starChip"></span></div>
    </div>
  </div>
  <div class="panel">
    <div class="legs" id="legs"></div>
    <div id="card"></div>
  </div>
</div>
<div id="tabs"></div>
<script src="shared.js"></script>
<script src="scenery.js"></script>
<script>
(function () {
  const T = window.TONIC, S = window.SCN, f = S.f;
  const SH = 540, RW = 900, N = 8, WW = RW * N, ROAD = 404;
  const FAR = 0.42, MID = 0.7;

  // Eight legs of the tour, one per chapter. The time of day moves from dawn to midnight as you travel.
  const LEGS = [
    { name: 'Garage Days', e: '🏡', sky: ['#f6a5b9', '#ffe2b2'], far: '#d7aac6', mid: '#8fc479', near: '#6fae5f' },
    { name: 'Sunflower Fields', e: '🌻', sky: ['#7ec8f7', '#dbf2ff'], far: '#a9cbe4', mid: '#e5c45a', near: '#9cbf4f' },
    { name: 'Lighthouse Coast', e: '🌊', sky: ['#3ea8f5', '#c3e9ff'], far: '#47a6da', mid: '#7cc06a', near: '#86c06a' },
    { name: 'Desert Highway', e: '🌵', sky: ['#6db4ec', '#ffd59c'], far: '#dc8c5c', mid: '#e8b874', near: '#dcae6b' },
    { name: 'Mountain Pass', e: '🏔️', sky: ['#8ba5df', '#ffc7a6'], far: '#b9c7ea', mid: '#eef3ff', near: '#f2f6ff' },
    { name: 'Rainy City', e: '🌧️', sky: ['#4e577b', '#8b809f'], far: '#555f7e', mid: '#5b5f73', near: '#3d4458' },
    { name: 'Bayou Nights', e: '🌙', sky: ['#111b3c', '#294158'], far: '#1c3a40', mid: '#1f3b3a', near: '#22392f' },
    { name: 'Neon City', e: '🌃', sky: ['#0a0820', '#2c0f50'], far: '#231a52', mid: '#221c4a', near: '#1b1838' },
  ];
  const STOPX = [170, 380, 590], VENUEX = 785;
  const sx = (l) => l.ci * RW + STOPX[l.li];

  const wrap = document.getElementById('wrap'), track = document.getElementById('track');
  const farEl = document.getElementById('far'), midEl = document.getElementById('mid');
  let V = wrap.clientWidth;
  const X = (x, k) => V / 2 + (x - V / 2) * k;   // world x → x inside a parallax layer

  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, t) => { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; };
  function hgrad(id, key, k, w) {
    return '<linearGradient id="' + id + '" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="' + f(w) + '" y2="0">' +
      LEGS.map((L, i) => '<stop offset="' + f(X((i + 0.5) * RW, k) / w) + '" stop-color="' + L[key] + '"/>').join('') + '</linearGradient>';
  }
  function band(y, amp, fill, w, seed) {
    const r = T.rng(seed);
    let d = 'M0 ' + SH + ' L0 ' + y;
    for (let x = 0; x <= w; x += 40) d += ' L' + x + ' ' + f(y + Math.sin(x / 140 + r()) * amp * 0.6 + Math.sin(x / 57) * amp * 0.4);
    return '<path d="' + d + ' L' + f(w) + ' ' + SH + 'Z" fill="' + fill + '"/>';
  }

  // ---------- far layer: horizon silhouettes ----------
  function farSvg() {
    const w = X(WW, FAR) + V;
    let s = '<defs>' + hgrad('gf', 'far', FAR, w) + '</defs>';
    LEGS.forEach((L, i) => {
      const x0 = X(i * RW, FAR), x1 = X((i + 1) * RW, FAR), cw = x1 - x0, r = T.rng(40 + i);
      if (i === 0) s += S.hills(300, 14, L.far, 1, { W: cw + 60, H: 340, freq: 1.5 }).replace('<path', '<path transform="translate(' + f(x0 - 30) + ' 0)"') +
        '<g fill="#b98bb0"><rect x="' + f(x0 + cw * 0.6) + '" y="250" width="4" height="50"/><rect x="' + f(x0 + cw * 0.6 + 22) + '" y="250" width="4" height="50"/><rect x="' + f(x0 + cw * 0.6 - 4) + '" y="232" width="34" height="22" rx="8"/></g>';
      if (i === 1) s += S.hills(305, 10, L.far, 2, { W: cw + 60, H: 340, freq: 1.2 }).replace('<path', '<path transform="translate(' + f(x0 - 30) + ' 0)"');
      if (i === 2) s += '<rect x="' + f(x0 - 40) + '" y="296" width="' + f(cw + 80) + '" height="60" fill="' + L.far + '"/><rect x="' + f(x0 - 40) + '" y="296" width="' + f(cw + 80) + '" height="3" fill="#a9dcf5"/>' +
        '<path d="M' + f(x0 + cw * 0.3) + ' 298 q20 -16 46 0z" fill="#5c9fbf"/>';
      if (i === 3) for (let k = 0; k < 3; k++) { const mx = x0 + k * cw / 3 + r() * 20, mw = 50 + r() * 30, mh = 34 + r() * 30; s += '<path d="M' + f(mx) + ' 310 l8 -' + f(mh) + ' h' + f(mw) + ' l8 ' + f(mh) + 'z" fill="' + (k % 2 ? '#c97a4d' : L.far) + '"/>'; }
      if (i === 4) for (let k = 0; k < 3; k++) s += S.mountain(x0 + k * cw / 2.5 + 20, 312, 110 + r() * 50, 90 + r() * 60, L.far, '#a3b4de', '#fff');
      if (i === 5 || i === 7) {
        for (let bx = x0 - 20; bx < x1 + 20; bx += 16 + r() * 14) {
          const bh = (i === 7 ? 60 : 30) + r() * (i === 7 ? 110 : 60), bw = 14 + r() * 14;
          s += '<rect x="' + f(bx) + '" y="' + f(312 - bh) + '" width="' + f(bw) + '" height="' + f(bh) + '" fill="' + L.far + '"/>';
          for (let wy = 312 - bh + 6; wy < 306; wy += 9) for (let wx = bx + 3; wx < bx + bw - 3; wx += 6) if (r() < 0.3)
            s += '<rect x="' + f(wx) + '" y="' + f(wy) + '" width="2.5" height="3.5" fill="' + (i === 7 ? (r() < 0.5 ? '#ff7ac6' : '#4cc9f0') : '#ffd98a') + '" opacity=".8"/>';
          if (i === 7 && bh > 140) s += '<rect x="' + f(bx + bw / 2 - 1) + '" y="' + f(312 - bh - 18) + '" width="2" height="18" fill="' + L.far + '"/><circle class="blink" cx="' + f(bx + bw / 2) + '" cy="' + f(312 - bh - 19) + '" r="2.4" fill="#ff4d6d"/>';
        }
      }
      if (i === 6) for (let bx = x0 - 20; bx < x1 + 20; bx += 12 + r() * 10) s += '<path d="M' + f(bx) + ' 314 q6 -' + f(30 + r() * 40) + ' 12 0z" fill="' + L.far + '"/>';
    });
    s += band(316, 6, 'url(#gf)', w, 3);
    // clouds drift high in the sky; grey and low in the rain, gone at night
    const CL = [['#fff', 0.9], ['#fff', 0.95], ['#fff', 0.85], ['#fff6e6', 0.7], ['#ffe6d6', 0.85], ['#454f70', 0.95], null, null];
    CL.forEach((c, i) => {
      if (!c) return;
      const x0 = X(i * RW, FAR), r = T.rng(500 + i), n = i === 5 ? 6 : 3;
      for (let k = 0; k < n; k++) s += S.cloud(x0 + r() * RW * FAR, (i === 5 ? 50 : 60) + r() * 110, (i === 5 ? 1.5 : 0.55) + r() * 0.45, c[0], c[1]);
    });
    return '<svg width="' + f(w) + '" viewBox="0 0 ' + f(w) + ' ' + SH + '">' + s + '</svg>';
  }

  // ---------- mid layer: the land you drive past ----------
  function midSvg() {
    const w = X(WW, MID) + V;
    let s = '<defs>' + hgrad('gm', 'mid', MID, w) + '</defs>' + band(352, 8, 'url(#gm)', w, 5);
    const items = [];
    const put = (x, y, svg) => items.push([y, svg]);
    LEGS.forEach((L, i) => {
      const x0 = X(i * RW, MID), cw = RW * MID, r = T.rng(70 + i);
      const at = (k) => x0 + cw * k;
      if (i === 0) {
        [0.18, 0.5, 0.82].forEach((k, j) => put(at(k), 372, S.cottage(at(k), 372, 1.5, ['#ffe0c2', '#cfe8ff', '#ffd1dc'][j], ['#d9534f', '#5b6fd6', '#7a5c99'][j], false)));
        [0.05, 0.33, 0.4, 0.66, 0.95].forEach((k) => put(at(k), 368, birch(at(k), 368, 1 + r() * 0.3)));
        s += '<path d="M' + f(at(0.1)) + ' 378 H' + f(at(0.9)) + '" stroke="#fff" stroke-width="2"/>';
      }
      if (i === 1) {
        for (let k = 0; k < 5; k++) s += '<path d="M' + f(x0 - 20) + ' ' + (362 + k * 8) + ' H' + f(x0 + cw + 20) + '" stroke="#d1ad42" stroke-width="2" opacity=".7"/>';
        [0.25, 0.7].forEach((k) => put(at(k), 372, windmill(at(k), 372)));
        [0.1, 0.45, 0.55, 0.9].forEach((k) => put(at(k), 378, '<g transform="translate(' + f(at(k)) + ' 378)"><ellipse cx="0" cy="-7" rx="10" ry="8" fill="#e9c85e"/><path d="M-9 -8 h18 M-9 -4 h18" stroke="#c9a23c" stroke-width="1.2"/></g>'));
      }
      if (i === 2) {
        put(at(0.62), 366, lighthouse(at(0.62), 366));
        [0.12, 0.2, 0.36, 0.84, 0.92].forEach((k) => put(at(k), 370, cypress(at(k), 370, 0.9 + r() * 0.4)));
      }
      if (i === 3) {
        [0.08, 0.3, 0.52, 0.86].forEach((k) => put(at(k), 372, cactus(at(k), 372, 0.9 + r() * 0.5)));
        put(at(0.7), 372, '<g transform="translate(' + f(at(0.7)) + ' 372)"><rect x="-2" y="-60" width="4" height="60" fill="#7a6a5a"/><rect x="-30" y="-84" width="60" height="26" rx="6" fill="#2a1f3d"/>' +
          '<text x="0" y="-65" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="14" fill="#ff7ac6" class="blink">MOTEL</text></g>');
        [0.2, 0.42, 0.95].forEach((k) => put(at(k), 374, S.rock(at(k), 374, 1, '#c08a55', '#a37244')));
      }
      if (i === 4) {
        for (let k = 0; k < 9; k++) { const x = at(0.04 + k * 0.115 + r() * 0.03); put(x, 368 + r() * 10, S.pine(x, 368 + r() * 10, 0.9 + r() * 0.6, '#2f6178', '#244c60', { snow: true, trunk: '#4a3528' })); }

          for (let wy = 380 - bh + 10; wy < 360; wy += 16) for (let wx = bx + 8; wx < bx + bw - 12; wx += 14) b += '<rect x="' + f(wx) + '" y="' + f(wy) + '" width="8" height="10" fill="' + (r() < 0.6 ? '#ffd36b' : '#3b3550') + '"/>';
          b += '<path d="M' + f(bx + 6) + ' 362 h' + f(bw - 12) + ' l-4 6 h' + f(-(bw - 20)) + 'z" fill="' + (r() < 0.5 ? '#e8553d' : '#3a8fb7') + '"/>';

      if (i === 6) {
        s += '<rect x="' + f(x0 - 20) + '" y="364" width="' + f(cw + 40) + '" height="30" fill="#183246"/>' +
          '<path d="M' + f(at(0.4)) + ' 372 h40 M' + f(at(0.42)) + ' 380 h28 M' + f(at(0.44)) + ' 388 h16" stroke="#fff6d6" stroke-width="2" opacity=".55"/>';
        [0.08, 0.22, 0.62, 0.78, 0.94].forEach((k) => put(at(k), 372, S.willow(at(k), 372, 1.3 + r() * 0.4, '#2c5446', '#1f3f35')));
        put(at(0.3), 366, '<g transform="translate(' + f(at(0.3)) + ' 366)"><path d="M-14 0 v8 M14 0 v8" stroke="#3a2a22" stroke-width="2"/><rect x="-18" y="-20" width="36" height="20" fill="#4a3a30"/><polygon points="-22,-19 0,-34 22,-19" fill="#2e2420"/><rect x="-8" y="-14" width="9" height="8" fill="#ffd36b"/><circle cx="-3.5" cy="-10" r="12" fill="#ffd36b" opacity=".15"/></g>');
      }
      if (i === 7) {
        const ax = at(0.5);
        s += '<g opacity=".9">' + [-1, 1].map((dir, j) => '<polygon class="sweep" style="transform-origin:' + f(ax + dir * 40) + 'px 330px;animation-delay:-' + j * 2 + 's" points="' + f(ax + dir * 40) + ',330 ' + f(ax + dir * 40 - 30) + ',40 ' + f(ax + dir * 40 + 30) + ',40" fill="url(#spot)"/>').join('') + '</g>';
        s += '<defs><linearGradient id="spot" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff3b0" stop-opacity=".55"/><stop offset="1" stop-color="#fff3b0" stop-opacity="0"/></linearGradient></defs>';
        put(ax, 380, '<g transform="translate(' + f(ax) + ' 380)"><path d="M-110 0 Q-110 -70 0 -76 Q110 -70 110 0Z" fill="#3a2f7a"/><path d="M-110 0 Q-110 -70 0 -76 Q110 -70 110 0" fill="none" stroke="#ff7ac6" stroke-width="3"/>' +
          '<path d="M-90 -20 Q0 -60 90 -20" fill="none" stroke="#4cc9f0" stroke-width="2" stroke-dasharray="4 6"/><rect x="-54" y="-40" width="108" height="24" rx="6" fill="#15122b" stroke="#ffd23f" stroke-width="2"/>' +
          '<text x="0" y="-23" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="14" fill="#ffd23f">TONIC LIVE</text></g>');
        [0.1, 0.9].forEach((k) => put(at(k), 380, '<rect x="' + f(at(k) - 16) + '" y="300" width="32" height="80" fill="#2a2160"/>' + [0, 1, 2, 3, 4].map((j) => '<rect x="' + f(at(k) - 10) + '" y="' + (308 + j * 14) + '" width="20" height="4" fill="' + (j % 2 ? '#ff7ac6' : '#4cc9f0') + '" opacity=".8"/>').join('')));
      }

    return '<svg width="' + f(w) + '" viewBox="0 0 ' + f(w) + ' ' + SH + '">' + s + '</svg>';
  }

  function birch(x, y, s) {

  // ---------- near layer: road, stops, venues, foreground ----------
  function nearHtml() {
    let s = '<defs>' + hgrad('gn', 'near', 1, WW) + hgrad('gv', 'mid', 1, WW) + '</defs>';
    s += '<rect x="0" y="' + (ROAD - 14) + '" width="' + WW + '" height="16" fill="url(#gv)"/>';
    s += '<rect x="0" y="' + ROAD + '" width="' + WW + '" height="40" fill="#4a4560"/><rect x="0" y="' + ROAD + '" width="' + WW + '" height="3" fill="#6a6487"/>';
    const curX = sx(T.lessons[T.CUR]);
    s += '<path d="M0 ' + (ROAD + 20) + ' H' + curX + '" stroke="#ffd23f" stroke-width="3" stroke-dasharray="16 14"/>';
    s += '<path d="M' + curX + ' ' + (ROAD + 20) + ' H' + WW + '" stroke="#8b85a8" stroke-width="3" stroke-dasharray="16 14"/>';
    s += '<rect x="0" y="' + (ROAD + 40) + '" width="' + WW + '" height="' + (SH - ROAD - 40) + '" fill="url(#gn)"/>';
    const items = [];
    LEGS.forEach((L, i) => {
      const x0 = i * RW, r = T.rng(200 + i);
      const fg = (n, draw) => { for (let k = 0; k < n; k++) { const x = x0 + r() * RW, y = ROAD + 56 + r() * 60; items.push([y, draw(x, y)]); } };
      if (i === 0) { fg(30, (x, y) => S.flower(x, y, ['#fff', '#ffd23f', '#ff8fbf'][Math.floor(r() * 3)])); fg(10, (x, y) => S.tuft(x, y, '#4f9a45', 1.2)); }
      if (i === 1) fg(14, (x, y) => S.g(x, y, 1 + r() * 0.4, '<path d="M0 0 V-34" stroke="#4f8a2b" stroke-width="2.5"/><path d="M0 -14 q8 -6 12 0 q-6 4 -12 0" fill="#5c9a33"/>' +
        [...Array(10)].map((_, k) => '<ellipse cx="0" cy="-44" rx="3" ry="8" fill="#ffc72c" transform="rotate(' + k * 36 + ' 0 -36)"/>').join('') + '<circle cx="0" cy="-36" r="6" fill="#7a4a1e"/>'));
      if (i === 2) { fg(8, (x, y) => S.rock(x, y, 1.2, '#9aa4a8', '#7d878c')); fg(14, (x, y) => S.tuft(x, y, '#5f9e4e', 1.3)); }
      if (i === 3) { fg(5, (x, y) => cactus(x, y, 0.6)); fg(8, (x, y) => S.rock(x, y, 1, '#c08a55', '#a37244')); }
      if (i === 4) fg(12, (x, y) => '<ellipse cx="' + f(x) + '" cy="' + f(y) + '" rx="' + f(14 + r() * 18) + '" ry="6" fill="#fff"/><ellipse cx="' + f(x + 4) + '" cy="' + f(y + 3) + '" rx="' + f(10 + r() * 10) + '" ry="3" fill="#d6e2f7"/>');
      if (i === 5) { fg(6, (x, y) => '<ellipse cx="' + f(x) + '" cy="' + f(y) + '" rx="26" ry="5" fill="#7d8bb0" opacity=".5"/><rect x="' + f(x - 2) + '" y="' + f(y - 14) + '" width="4" height="14" fill="#ffd36b" opacity=".35"/>'); }
      if (i === 6) fg(16, (x, y) => S.g(x, y, 1.3, '<path d="M0 0 q-2 -14 -6 -22 M2 0 q1 -14 4 -24 M4 0 q4 -10 10 -16" stroke="#3d5e45" stroke-width="2" fill="none"/><rect x="3" y="-30" width="3" height="10" rx="1.5" fill="#6b4a2b"/>'));
      if (i === 7) fg(8, (x, y) => '<ellipse cx="' + f(x) + '" cy="' + f(y) + '" rx="30" ry="5" fill="' + (r() < 0.5 ? '#ff7ac6' : '#4cc9f0') + '" opacity=".25"/>');
      // a highway sign at the start of every leg
      if (i) items.push([ROAD - 1, '<g transform="translate(' + (x0 + 40) + ' ' + ROAD + ')"><rect x="-1.5" y="-58" width="3" height="58" fill="#6b6488"/><rect x="-36" y="-84" width="72" height="30" rx="5" fill="#1f8a5a" stroke="#fff" stroke-width="2"/>' +
        '<text x="0" y="-73" text-anchor="middle" font-family="DM Sans, sans-serif" font-weight="700" font-size="8" fill="#fff">LEG ' + (i + 1) + '</text><text x="0" y="-61" text-anchor="middle" font-family="DM Sans, sans-serif" font-weight="700" font-size="8.5" fill="#fff">' + L.name.toUpperCase() + '</text></g>']);
    });
    s += items.sort((a, b) => a[0] - b[0]).map((x) => x[1]).join('');
    let html = '<svg width="' + WW + '" viewBox="0 0 ' + WW + ' ' + SH + '">' + s + '</svg>';

    // weather per leg
    const WX = [
      '<div class="mist"></div>',
      '<svg class="cloudmove" width="900" height="200" style="position:absolute;top:20px">' + S.cloud(120, 60, 1.4, '#fff', 0.95) + S.cloud(420, 40, 1.1, '#fff', 0.9) + S.cloud(700, 90, 1.6, '#fff', 0.95) + '</svg>',
      [0, 1, 2].map((k) => '<svg class="gull" style="top:' + (90 + k * 26) + 'px;animation-delay:-' + k * 4 + 's" viewBox="0 0 18 8"><path d="M0 2 Q4 -1 9 5 Q13 -1 18 2" stroke="#fff" stroke-width="1.8" fill="none"/></svg>').join(''),
      '<div class="haze"></div><span class="weed"></span>',
      '<div class="snow"></div><div class="snow b"></div>',
      '<div class="rain"></div><div class="rain b"></div>',
      [...Array(14)].map((_, k) => '<i class="fly" style="left:' + ((k * 67) % 880) + 'px;top:' + (300 + (k * 37) % 200) + 'px;animation-delay:-' + (k % 5) + 's"></i>').join(''),
      [[160, 70, '#ff7ac6'], [420, 40, '#4cc9f0'], [690, 90, '#ffd23f'], [300, 120, '#3ddc97']].map(([x, y, c], k) =>
        '<i class="boom" style="left:' + x + 'px;top:' + y + 'px;animation-delay:-' + k * 0.7 + 's;box-shadow:' + burst(c) + '"></i>').join(''),
    ];
    WX.forEach((w, i) => { html += '<div class="wx" style="left:' + i * RW + 'px;width:' + RW + 'px">' + w + '</div>'; });

    // stops
    T.lessons.forEach((l) => {
      const flag = l.state === 'current' ? '<span class="flag">NEXT</span>' : '';
      const face = l.state === 'locked' ? '🔒' : l.icon;
      html += '<button class="post ' + l.state + '" data-i="' + l.i + '" style="left:' + sx(l) + 'px" aria-label="Stop ' + l.num + ': ' + l.title + '">' + flag +
        '<span class="board"><span class="n">' + l.num + '</span><span>' + face + '</span></span><span class="pole"></span>' + (l.state === 'done' ? T.stars(l.stars) : '') + '</button>';
    });
    // venues
    T.chapters.forEach((ch) => { html += '<button class="venue" data-t="' + ch.ci + '" style="left:' + (ch.ci * RW + VENUEX) + 'px" aria-label="Chapter ' + ch.num + ' show">' + venue(ch) + '</button>'; });
    // van
    html += '<div class="van" style="left:' + (curX - 78) + 'px"><span class="puff"></span><span class="puff"></span>' + van() + '</div>';
    return html;
  }
  function burst(c) {
    const out = [];
    for (let k = 0; k < 12; k++) { const a = k / 12 * Math.PI * 2; out.push(f(Math.cos(a) * 34) + 'px ' + f(Math.sin(a) * 34) + 'px 0 1px ' + c); out.push(f(Math.cos(a) * 20) + 'px ' + f(Math.sin(a) * 20) + 'px 0 0 ' + c); }
    return out.join(',');
  }
  function venue(ch) {
    const won = ch.done, open = ch.open;
    const wall = ['#c76b5a', '#6a8ed6', '#3a8fb7', '#d58a4a', '#7a5c99', '#8a4f45', '#4a5a4a', '#3a2f7a'][ch.ci];
    let bulbs = '';
    for (let k = 0; k < 9; k++) bulbs += '<circle class="' + (won ? 'bulb' : '') + '" style="animation-delay:' + (k % 2) * 0.5 + 's" cx="' + (22 + k * 11) + '" cy="66" r="2.6" fill="' + (won ? '#ffe680' : '#6d6788') + '"/>';
    const msg = won ? 'SOLD OUT' : open ? 'TONIGHT?' : 'SOON';
    return '<svg viewBox="0 0 132 170"><ellipse cx="66" cy="168" rx="60" ry="5" fill="#000" opacity=".2"/>' +
      '<rect x="14" y="44" width="104" height="124" fill="' + wall + '"/><rect x="10" y="38" width="112" height="10" fill="#2a2440"/>' +
      '<rect x="16" y="58" width="100" height="34" rx="4" fill="#15122b"/>' + bulbs.replace(/cy="66"/g, 'cy="61"') + bulbs.replace(/cy="66"/g, 'cy="89"') +
      '<text x="66" y="80" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="13" fill="' + (won ? '#ffd23f' : '#aaa3d0') + '">' + msg + '</text>' +
      '<rect x="48" y="122" width="36" height="46" rx="3" fill="#2a2440"/><rect x="51" y="125" width="14" height="43" fill="' + (won || open ? '#ffd36b' : '#3d3670') + '" opacity=".8"/><rect x="67" y="125" width="14" height="43" fill="' + (won || open ? '#ffd36b' : '#3d3670') + '" opacity=".8"/>' +
      '<rect x="22" y="104" width="18" height="14" fill="' + (open ? '#ffd36b' : '#3d3670') + '"/><rect x="92" y="104" width="18" height="14" fill="' + (open ? '#ffd36b' : '#3d3670') + '"/>' +
      '<text x="66" y="30" text-anchor="middle" font-size="' + (won ? 30 : 22) + '"' + (won ? '' : ' opacity=".45"') + '>' + (won ? '🏆' : '🎤') + '</text>' +
      '<rect x="40" y="0" width="52" height="16" rx="8" fill="#15122b" opacity=".75"/><text x="66" y="11.5" text-anchor="middle" font-family="DM Sans, sans-serif" font-weight="700" font-size="9" fill="#fff">CH ' + ch.num + ' SHOW</text></svg>';
  }
  function van() {
    return '<svg viewBox="0 0 92 54"><ellipse cx="46" cy="52" rx="42" ry="3" fill="#000" opacity=".25"/>' +
      '<path d="M6 16 Q6 6 16 6 H66 Q78 6 84 18 L88 30 V42 H4 V18Z" fill="#ffd23f"/><path d="M4 32 H88 V42 H4Z" fill="#fff4cc"/>' +
      '<rect x="12" y="11" width="14" height="12" rx="3" fill="#2a2440"/><rect x="30" y="11" width="14" height="12" rx="3" fill="#2a2440"/><rect x="48" y="11" width="14" height="12" rx="3" fill="#2a2440"/>' +
      '<path d="M66 11 H72 Q78 11 81 19 L82 23 H66Z" fill="#9ad8ff"/><circle cx="86" cy="34" r="2.4" fill="#fff6b0"/>' +
      '<g transform="translate(22 26) scale(.16)"><rect x="48" y="8" width="8" height="64" rx="4" fill="#15122b"/><path d="M54 8c14 3 20 13 15 27-2-9-7-13-15-14z" fill="#15122b"/><ellipse cx="33" cy="72" rx="23" ry="18" transform="rotate(-18 33 72)" fill="#15122b"/></g>' +
      '<text x="56" y="38" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="8" fill="#2a2440">TONIC</text>' +
      '<circle cx="22" cy="43" r="8" fill="#2a2440"/><circle cx="22" cy="43" r="3.5" fill="#aaa3d0"/><circle cx="70" cy="43" r="8" fill="#2a2440"/><circle cx="70" cy="43" r="3.5" fill="#aaa3d0"/>' +
      '<rect x="14" y="1" width="44" height="6" rx="2" fill="#7a5c99"/><rect x="18" y="-3" width="14" height="5" rx="1.5" fill="#ff7ac6"/><rect x="36" y="-2" width="18" height="4" rx="1.5" fill="#4cc9f0"/></svg>';
  }

  // ---------- build + parallax ----------
  function build() {
    V = wrap.clientWidth;
    farEl.innerHTML = farSvg();
    midEl.innerHTML = midSvg();
    track.style.width = WW + 'px';
    track.innerHTML = nearHtml();
  }
  build();

  const sky = document.getElementById('sky'), orb = document.getElementById('orb'), starsEl = document.getElementById('stars');
  let legShown = -1;
  function onScroll() {
    const s = wrap.scrollLeft;
    farEl.style.transform = 'translateX(' + f(-s * FAR) + 'px)';
    midEl.style.transform = 'translateX(' + f(-s * MID) + 'px)';
    const r = Math.max(0, Math.min(N - 0.001, (s + V / 2) / RW));   // 0..8, which leg is in the middle
    const a = Math.max(0, Math.min(N - 1, Math.floor(r - 0.5))), b = Math.min(N - 1, a + 1);
    const t = Math.max(0, Math.min(1, r - 0.5 - a));
    sky.style.background = 'linear-gradient(' + mix(LEGS[a].sky[0], LEGS[b].sky[0], t) + ',' + mix(LEGS[a].sky[1], LEGS[b].sky[1], t) + ' 60%)';
    // the sun climbs, peaks around midday and sets; then the moon rises
    if (r < 5.4) {
      const h = Math.sin(Math.PI * Math.min(r, 5.4) / 5.4);
      orb.style.left = (V * 0.72) + 'px';
      orb.style.top = (300 - h * 230) + 'px';
      const warm = 1 - h;
      orb.style.background = mix('#fff6b0', '#ff9a4a', warm * 0.9);
      orb.style.boxShadow = '0 0 0 14px ' + 'rgba(255,240,170,.25), 0 0 60px 20px rgba(255,200,120,.35)';
      orb.style.opacity = r > 5 ? (5.4 - r) / 0.4 : 1;
    } else {
      const h = Math.sin(Math.PI * Math.min(1, (r - 5.4) / 3.2) * 0.5 + 0.2);
      orb.style.left = (V * 0.25) + 'px';
      orb.style.top = (300 - h * 220) + 'px';
      orb.style.background = '#f4f0ff';
      orb.style.boxShadow = 'inset -14px -6px 0 0 #d7d0ef, 0 0 40px 10px rgba(220,215,255,.25)';
      orb.style.opacity = Math.min(1, (r - 5.4) / 0.4);
    }
    starsEl.style.opacity = Math.max(0, Math.min(1, (r - 5.3) / 1.1));
    const leg = Math.floor(r);
    if (leg !== legShown) setLeg(leg);
  }
  wrap.addEventListener('scroll', onScroll, { passive: true });
  // mouse wheel scrolls sideways
  wrap.addEventListener('wheel', (e) => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { wrap.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
  // drag to scroll with a mouse
  let drag = null;
  wrap.addEventListener('pointerdown', (e) => { if (e.pointerType === 'mouse') drag = { x: e.clientX, s: wrap.scrollLeft, moved: false }; });
  addEventListener('pointermove', (e) => { if (drag) { const dx = e.clientX - drag.x; if (Math.abs(dx) > 4) drag.moved = true; wrap.scrollLeft = drag.s - dx; } });
  addEventListener('pointerup', () => { setTimeout(() => { drag = null; }, 0); });

  // ---------- panel ----------
  const legsEl = document.getElementById('legs');
  legsEl.innerHTML = T.chapters.map((ch) => '<button class="leg ' + (ch.done ? 'done' : ch.open ? 'open' : 'locked') + '" data-leg="' + ch.ci + '"><span>' + LEGS[ch.ci].e + '</span>' + LEGS[ch.ci].name + '</button>').join('');
  legsEl.addEventListener('click', (e) => {
    const b = e.target.closest('.leg');
    if (!b) return;
    const ci = +b.dataset.leg, ch = T.chapters[ci];
    const target = ch.lessons.find((l) => l.state === 'current') || ch.lessons[0];
    select(target.i);
    wrap.scrollTo({ left: sx(target) - V / 2 + 60, behavior: 'smooth' });
  });
  function setLeg(ci) {
    legShown = ci;
    const ch = T.chapters[ci];
    document.getElementById('tkE').textContent = LEGS[ci].e;
    document.getElementById('tkK').textContent = 'World tour · Leg ' + ch.num + ' of 8';
    document.getElementById('tkT').textContent = LEGS[ci].name;
    legsEl.querySelectorAll('.leg').forEach((b, i) => b.classList.toggle('on', i === ci));
    const on = legsEl.children[ci];
    legsEl.scrollTo({ left: on.offsetLeft - 16 - (legsEl.clientWidth - on.offsetWidth) / 2, behavior: 'smooth' });
  }
  document.getElementById('starChip').textContent = '⭐ ' + T.totalStars;

  const card = document.getElementById('card');
  function select(i, isVenue) {
    track.querySelectorAll('.sel').forEach((n) => n.classList.remove('sel'));
    if (isVenue) {
      const ch = T.chapters[i];
      track.querySelector('[data-t="' + i + '"]').classList.add('sel');
      card.innerHTML = '<div class="card"><div class="ic">' + (ch.done ? '🏆' : '🎤') + '</div><div class="t"><div class="k">Leg ' + ch.num + ' · ' + LEGS[i].name + '</div><h2>' + (ch.done ? 'Show sold out!' : 'The ' + ch.title + ' show') + '</h2>' +
        '<div class="m">' + (ch.done ? T.stars(3) + ' ' + ch.starCount + ' of 9 stars · +50 XP' : 'Play all three stops of this leg to headline it') + '</div></div></div>' +
        '<button class="go ' + (ch.done ? 'alt' : '') + '"' + (ch.done ? '' : ' disabled') + '>' + (ch.done ? 'Replay this leg' : 'Locked') + '</button>';
      return;
    }
    const l = T.lessons[i];
    track.querySelector('[data-i="' + i + '"]').classList.add('sel');
    const locked = l.state === 'locked';
    card.innerHTML = '<div class="card"><div class="ic">' + l.icon + '</div><div class="t"><div class="k">Stop ' + l.num + ' · ' + T.chapters[l.ci].title + '</div><h2>' + l.title + '</h2>' +
      '<div class="m">' + (l.state === 'done' ? T.stars(l.stars) + ' Best ' + l.stars + '/3 · ' : '') + l.mins + ' min · 5 questions</div></div></div>' +
      '<button class="go ' + (l.state === 'done' ? 'alt' : '') + '"' + (locked ? ' disabled' : '') + '>' + (l.state === 'done' ? 'Play it again' : locked ? '🔒 Finish the stops before' : 'Hit the road · +15 XP') + '</button>';
  }
  track.addEventListener('click', (e) => {
    if (drag && drag.moved) return;
    const p = e.target.closest('.post'), v = e.target.closest('.venue');
    if (p) select(+p.dataset.i);
    else if (v) select(+v.dataset.t, true);
  });

  document.getElementById('tabs').innerHTML = T.tabbar();
  select(T.CUR);
  const land = () => { wrap.scrollLeft = sx(T.lessons[T.CUR]) - V / 2 + 40; onScroll(); };
  land();
  addEventListener('load', land);
  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { const s = wrap.scrollLeft + V / 2; build(); select(T.CUR); wrap.scrollLeft = s - V / 2; onScroll(); }, 150); });
})();
</script>
</body>
</html>

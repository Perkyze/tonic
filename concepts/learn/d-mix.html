<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn — Trail stones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  body { background: #0b1030; }
  #world { position: relative; max-width: 480px; margin: 0 auto; }
  .biome { position: relative; aspect-ratio: 390 / 900; }
  .biome > svg.bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .fx { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .seam { position: absolute; left: 0; right: 0; bottom: 0; aspect-ratio: 390 / 150; transform: translateY(50%); z-index: 5; pointer-events: none; }
  .seam svg { width: 100%; height: 100%; display: block; }

  /* chapter title written on the landscape */
  .ttl { position: absolute; top: 9.5%; width: 56%; z-index: 2; }
  .ttl.L { left: 5%; } .ttl.R { right: 5%; text-align: right; }
  .ttl .k { font: 800 12px var(--body); letter-spacing: .12em; text-transform: uppercase; opacity: .75; }
  .ttl h2 { font-size: 28px; margin: 4px 0 4px; letter-spacing: -.02em; }
  .ttl p { font-size: 14px; font-weight: 500; opacity: .8; }
  .ttl .lockchip { display: inline-flex; gap: 5px; align-items: center; margin-top: 8px; padding: 4px 10px; border-radius: 99px; font: 700 12px var(--body); background: rgba(0, 0, 0, .18); }
  .dark { color: var(--tx); } .light { color: #fff; text-shadow: 0 1px 8px rgba(0, 0, 0, .25); }

  /* chunky stepping-stone coins, sitting on the trail */
  .node { position: absolute; z-index: 3; width: 74px; height: 70px; margin: -38px 0 0 -37px; }
  .coin { position: relative; width: 74px; height: 66px; border-radius: 50%; background: var(--ac); box-shadow: 0 8px 0 var(--acd), 0 14px 18px rgba(0, 0, 0, .22); display: grid; place-items: center; font-size: 30px; transition: transform .08s, box-shadow .08s; }
  .coin::after { content: ''; position: absolute; left: 14px; top: 8px; width: 26px; height: 12px; border-radius: 50%; background: rgba(255, 255, 255, .3); transform: rotate(-18deg); }
  .coin:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--acd); }
  .node.locked .coin { background: rgba(240, 238, 248, .92); box-shadow: 0 8px 0 rgba(150, 144, 185, .9), 0 14px 18px rgba(0, 0, 0, .18); color: #9a94b8; }
  .node.locked .coin svg { width: 26px; height: 26px; fill: currentColor; }
  .node .badge { position: absolute; left: 50%; bottom: -22px; transform: translateX(-50%); padding: 2px 6px; border-radius: 99px; background: rgba(20, 16, 40, .55); }
  .node .badge .stars i { width: 13px; height: 13px; }
  .node.current .ring { position: absolute; inset: -11px -11px -5px; border-radius: 50%; border: 6px solid #fff; opacity: .55; }
  .node.current .ring::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 6px solid transparent; border-top-color: var(--yellow); border-right-color: var(--yellow); transform: rotate(-20deg); }
  .node.current .coin { background: var(--yellow); box-shadow: 0 8px 0 var(--yellow-d), 0 14px 18px rgba(0, 0, 0, .22); }
  .start { position: absolute; left: 50%; bottom: calc(100% + 18px); transform: translateX(-50%); padding: 9px 14px; border-radius: 12px; background: #fff; color: var(--yellow-d); font: 800 15px var(--display); letter-spacing: .06em; white-space: nowrap; box-shadow: 0 3px 0 rgba(0, 0, 0, .18); animation: bob 1.4s ease-in-out infinite; }
  .start::after { content: ''; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); border: 8px solid transparent; border-top-color: #fff; }
  @keyframes bob { 50% { transform: translate(-50%, -6px); } }

  .node.trophy { width: 96px; height: 80px; margin: -42px 0 0 -48px; }
  .node.trophy .coin { width: 96px; height: 74px; border-radius: 26px; font-size: 40px; background: linear-gradient(#ffe37a, #ffc93c); box-shadow: 0 8px 0 var(--yellow-d), 0 14px 18px rgba(0, 0, 0, .22); }
  .node.trophy.locked .coin { background: rgba(240, 238, 248, .92); box-shadow: 0 8px 0 rgba(150, 144, 185, .9), 0 14px 18px rgba(0, 0, 0, .18); }
  .node.trophy .coin span { animation: float 2.6s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-5px); } }

  /* mascot beside the next lesson */
  .buddy { position: absolute; z-index: 4; width: 64px; height: 80px; margin: -66px 0 0 -32px; }
  .buddy .m { width: 100%; height: 100%; animation: hop 2.4s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes hop { 0%, 70%, 100% { transform: none; } 80% { transform: translateY(-8px) scaleY(1.04); } 90% { transform: scaleY(.95); } }

  /* sticky chapter banner, tinted by the landscape you're in */
  .banner-wrap { position: fixed; top: 8px; left: 0; right: 0; z-index: 20; display: flex; justify-content: center; pointer-events: none; }
  .banner { pointer-events: auto; width: calc(100% - 24px); max-width: 456px; display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; border-radius: 18px; background: var(--c); box-shadow: 0 5px 0 var(--cd), 0 10px 24px rgba(0, 0, 0, .2); color: #fff; transition: background .35s, box-shadow .35s; }
  .banner .t { flex: 1; min-width: 0; }
  .banner .k { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 800 11px var(--body); letter-spacing: .1em; text-transform: uppercase; opacity: .85; }
  .banner h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 20px; margin-top: 3px; text-shadow: 0 1px 0 rgba(0, 0, 0, .12); }
  .banner .dots { display: flex; gap: 4px; margin-top: 6px; }
  .banner .dots i { width: 22px; height: 5px; border-radius: 9px; background: rgba(255, 255, 255, .3); }
  .banner .dots i.on { background: #fff; }
  .banner .guide { display: flex; align-items: center; gap: 6px; padding: 9px 11px; border-radius: 14px; border: 2px solid rgba(255, 255, 255, .35); font: 800 12px var(--body); letter-spacing: .04em; text-transform: uppercase; }
  .banner .guide span { font-size: 17px; }
  .banner .streak { font: 800 15px var(--display); padding: 0 4px; }

  /* the card that drops down under the tapped coin */
  .pop { position: absolute; z-index: 25; width: min(320px, calc(100% - 32px)); padding: 18px; border-radius: 20px; background: var(--ac); color: #fff; box-shadow: 0 6px 0 var(--acd), 0 18px 40px rgba(0, 0, 0, .35);
    transform: translateX(-50%) scale(.9); transform-origin: var(--ax, 50%) 0; opacity: 0; pointer-events: none; transition: transform .16s, opacity .16s; }
  .pop.on { transform: translateX(-50%) scale(1); opacity: 1; pointer-events: auto; }
  .pop::before { content: ''; position: absolute; top: -12px; left: var(--ax, 50%); transform: translateX(-50%); border: 12px solid transparent; border-top: 0; border-bottom-color: var(--ac); }
  .pop .k { font: 700 12px var(--body); letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
  .pop h3 { font-size: 21px; margin: 4px 0 6px; }
  .pop .row { display: flex; align-items: center; gap: 10px; font-weight: 500; opacity: .95; margin-bottom: 14px; }
  .pop .row .stars i { width: 16px; height: 16px; }
  .pop .ic { float: right; font-size: 34px; line-height: 1; margin-left: 8px; }
  .pop .go { width: 100%; padding: 14px; border-radius: 14px; background: #fff; color: var(--acd); font: 800 17px var(--display); letter-spacing: .03em; box-shadow: 0 5px 0 rgba(0, 0, 0, .2); }
  .pop.locked { background: #fff; color: var(--paper-ink); box-shadow: 0 6px 0 #d6d2e6, 0 18px 40px rgba(0, 0, 0, .3); }
  .pop.locked::before { border-bottom-color: #fff; }
  .pop.locked .go { background: #ece9f5; color: #9b95b8; box-shadow: none; }

  .jump { position: fixed; right: max(16px, calc(50% - 224px)); bottom: 100px; z-index: 22; width: 52px; height: 52px; border-radius: 16px; background: #fff; box-shadow: 0 4px 0 #d6d2e6, 0 8px 20px rgba(0, 0, 0, .2); display: grid; place-items: center; transition: opacity .2s, transform .2s; }
  .jump svg { width: 24px; height: 24px; stroke: var(--paper-ink); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s; }
  .jump.hide { opacity: 0; transform: scale(.7); pointer-events: none; }
  .jump.up svg { transform: rotate(180deg); }

  .finale { position: absolute; left: 0; right: 0; bottom: 3%; text-align: center; color: rgba(255, 255, 255, .7); font-weight: 500; z-index: 3; }

  /* ---------- weather ---------- */
  .bfly { position: absolute; font-size: 16px; animation: flutter 9s linear infinite; }
  @keyframes flutter { 0% { transform: translate(0, 0) rotate(-8deg); } 25% { transform: translate(40px, -30px) rotate(8deg); } 50% { transform: translate(10px, -70px) rotate(-6deg); } 75% { transform: translate(-30px, -30px) rotate(10deg); } 100% { transform: translate(0, 0) rotate(-8deg); } }
  .fog { position: absolute; left: -40%; width: 180%; height: 16%; background: radial-gradient(closest-side, rgba(255, 255, 255, .7), rgba(255, 255, 255, 0)); animation: drift 14s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translateX(18%); } }
  .leaf { position: absolute; top: -4%; width: 12px; height: 8px; border-radius: 0 80% 0 80%; animation: fall linear infinite; }
  @keyframes fall { 0% { top: -4%; transform: translateX(0) rotate(0); } 25% { transform: translateX(30px) rotate(90deg); } 50% { transform: translateX(-10px) rotate(200deg); } 75% { transform: translateX(26px) rotate(290deg); } 100% { top: 102%; transform: translateX(0) rotate(400deg); } }
  .haze { position: absolute; left: 0; right: 0; top: 20%; height: 14%; background: linear-gradient(transparent, rgba(255, 220, 150, .35), transparent); animation: shimmer 3s ease-in-out infinite alternate; }
  @keyframes shimmer { to { transform: scaleY(1.3) translateY(4px); opacity: .6; } }
  .bird { position: absolute; width: 18px; height: 8px; animation: fly linear infinite; }
  .bird svg { width: 100%; height: 100%; overflow: visible; }
  @keyframes fly { from { transform: translateX(-60px); } to { transform: translateX(520px); } }
  .glint { position: absolute; width: 14px; height: 2px; border-radius: 2px; background: #fff6cf; animation: twinkle 2.4s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .1; } 50% { opacity: 1; } }
  .rain { position: absolute; inset: -10% 0 0; background-image: repeating-linear-gradient(105deg, transparent 0 14px, rgba(220, 232, 255, .38) 14px 15px, transparent 15px 31px); background-size: 100% 90px; animation: pour .5s linear infinite; }
  .rain.b { opacity: .55; background-size: 100% 60px; animation-duration: .35s; background-image: repeating-linear-gradient(100deg, transparent 0 22px, rgba(220, 232, 255, .35) 22px 23px, transparent 23px 40px); }
  @keyframes pour { to { background-position: -24px 90px; } }
  .flash { position: absolute; inset: 0; background: #e8eeff; opacity: 0; animation: flash 9s linear infinite; }
  @keyframes flash { 0%, 90%, 92.5%, 96%, 100% { opacity: 0; } 91% { opacity: .45; } 94% { opacity: .3; } }
  .snow { position: absolute; inset: 0; background-image: radial-gradient(3px 3px at 20px 30px, #fff 50%, transparent 51%), radial-gradient(2px 2px at 80px 70px, #fff 50%, transparent 51%), radial-gradient(4px 4px at 130px 20px, #fff 50%, transparent 51%), radial-gradient(2.5px 2.5px at 170px 110px, #fff 50%, transparent 51%), radial-gradient(3px 3px at 50px 140px, #fff 50%, transparent 51%);
    background-size: 190px 160px; animation: snow 9s linear infinite; opacity: .95; }
  .snow.b { background-size: 260px 230px; animation-duration: 15s; opacity: .7; }
  @keyframes snow { from { background-position: 0 0; } to { background-position: 60px 160px; } }
  .snow.b { animation-name: snowb; } @keyframes snowb { from { background-position: 0 0; } to { background-position: -40px 230px; } }
  .shoot { position: absolute; top: 8%; left: 70%; width: 90px; height: 2px; background: linear-gradient(90deg, #fff, transparent); transform: rotate(-20deg); opacity: 0; animation: shoot 7s ease-in infinite; }
  @keyframes shoot { 0%, 80% { opacity: 0; transform: rotate(-20deg) translateX(0); } 82% { opacity: 1; } 92% { opacity: 0; transform: rotate(-20deg) translateX(-220px); } 100% { opacity: 0; } }
  .tw { animation: twinkle 3s ease-in-out infinite; }
  .aur { animation: aur 7s ease-in-out infinite alternate; transform-origin: 50% 50%; transform-box: fill-box; }
  @keyframes aur { from { transform: skewX(-8deg) scaleY(.9); opacity: .55; } to { transform: skewX(8deg) scaleY(1.12); opacity: .95; } }
  .rays { animation: spin 40s linear infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ripple { animation: ripple 2.6s ease-out infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes ripple { from { transform: scale(.3); opacity: .9; } to { transform: scale(1.6); opacity: 0; } }
  .smoke { animation: smoke 4s ease-out infinite; transform-box: fill-box; }
  @keyframes smoke { from { transform: translate(0, 0) scale(.6); opacity: .8; } to { transform: translate(8px, -26px) scale(1.4); opacity: 0; } }
  .boat { animation: rock 4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes rock { 50% { transform: rotate(4deg) translateY(1px); } }
</style>
</head>
<body>
<div class="banner-wrap"><header class="banner" id="banner"></header></div>
<button class="jump hide" id="jump" aria-label="Jump to your next lesson"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
<main id="world"></main>
<div id="tabs"></div>
<div class="sheet-scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<script src="shared.js"></script>
<script src="scenery.js"></script>
<script>
(function () {
  const T = window.TONIC, S = window.SCN, f = S.f;
  const W = 390, H = 900;

  // Eight biomes, one per chapter. Each has its own sky, ground, trees and weather.
  // stops: three lessons, then the trophy. inX/outX: where the trail enters and leaves.
  const BIOMES = [
    { name: 'Meadow', inX: 300, outX: 240, stops: [[285, 295], [125, 395], [255, 525], [120, 670]], ttl: 'L', txt: 'dark', tx: '#1d3a2a', ac: '#2f9e62',
      seam: '#effaf6', trail: ['#f7e9bd', '#e3cd8c'], draw: meadow, fx: fxButterflies },
    { name: 'Pine lake', inX: 240, outX: 100, stops: [[300, 295], [150, 395], [270, 530], [160, 680]], ttl: 'L', txt: 'dark', tx: '#163c37', ac: '#2a7f72',
      seam: '#fff4e2', trail: ['#e5f5ef', '#bfe0d6'], draw: pinelake, fx: fxFog },
    { name: 'Autumn woods', inX: 100, outX: 280, stops: [[110, 295], [265, 385], [130, 525], [265, 675]], ttl: 'R', txt: 'dark', tx: '#4a2410', ac: '#c4561c',
      seam: '#fff1d6', trail: ['#f7dcae', '#ddb77a'], draw: autumn, fx: fxLeaves },
    { name: 'Savanna', inX: 280, outX: 110, stops: [[290, 295], [140, 395], [260, 530], [120, 680]], ttl: 'L', txt: 'dark', tx: '#4b2a0b', ac: '#c2621f',
      seam: '#ffe3d6', trail: ['#f9e3b0', '#dcb873'], draw: savanna, fx: fxHaze },
    { name: 'Sunset coast', inX: 110, outX: 270, stops: [[100, 295], [255, 400], [120, 535], [270, 680]], ttl: 'R', txt: 'light', tx: '#fff', ac: '#e0567f',
      seam: '#c3cce2', trail: ['#c99263', '#a5734a'], draw: coast, fx: fxGlints },
    { name: 'Rainy moor', inX: 270, outX: 130, stops: [[290, 295], [150, 395], [270, 530], [140, 680]], ttl: 'L', txt: 'light', tx: '#fff', ac: '#5a7bd6',
      seam: '#eef3ff', trail: ['#93a3b8', '#93a3b8'], draw: moor, fx: fxRain },
    { name: 'Snowy peaks', inX: 130, outX: 220, stops: [[110, 295], [262, 395], [120, 530], [262, 680]], ttl: 'R', txt: 'dark', tx: '#1f2e57', ac: '#3f6fd8',
      seam: '#323a86', trail: ['#ffffff', '#b8cbec'], draw: peaks, fx: fxSnow },
    { name: 'Aurora', inX: 220, outX: null, stops: [[300, 315], [150, 430], [270, 560], [195, 700]], ttl: 'L', txt: 'light', tx: '#fff', ac: '#8f6bff',
      seam: null, trail: ['#c6b5ff', '#c6b5ff'], draw: aurora, fx: fxNight },
  ];

  // Stepping-stone layout: one S-curve that continues from biome to biome, 4 coins each (3 lessons + trophy)
  BIOMES.forEach((b, ci) => {
    b.stops = [0, 1, 2, 3].map((j) => [Math.round(195 + 88 * Math.sin((ci * 4 + j) * Math.PI / 4)), [300, 420, 540, 665][j]]);
    b.inX = 195;
    b.outX = ci < BIOMES.length - 1 ? 195 : null;
  });
  const shade = (h, k) => '#' + [1, 3, 5].map((i) => Math.round(parseInt(h.slice(i, i + 2), 16) * k).toString(16).padStart(2, '0')).join('');

  const sky = (id, a, b, h) => '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + a + '"/><stop offset="1" stop-color="' + b + '"/></linearGradient></defs>' +
    '<rect width="' + W + '" height="' + (h + 40) + '" fill="url(#' + id + ')"/>';

  function trailSvg(b, d) {
    const [c, e] = b.trail;
    if (b.name === 'Sunset coast') return '<path d="' + d + '" stroke="#8a5d38" stroke-width="22" fill="none" stroke-linecap="round" opacity=".35"/>' +
      '<path d="' + d + '" stroke="' + c + '" stroke-width="18" fill="none" stroke-linecap="round"/><path d="' + d + '" stroke="' + e + '" stroke-width="18" fill="none" stroke-dasharray="2 7"/>';
    if (b.name === 'Rainy moor') return '<path d="' + d + '" stroke="rgba(0,0,0,.18)" stroke-width="17" fill="none" stroke-linecap="round" stroke-dasharray="1 19" transform="translate(0 3)"/>' +
      '<path d="' + d + '" stroke="' + c + '" stroke-width="16" fill="none" stroke-linecap="round" stroke-dasharray="1 19"/>';
    if (b.name === 'Aurora') return '<path d="' + d + '" stroke="#8f7bff" stroke-width="20" fill="none" opacity=".18" stroke-linecap="round"/>' +
      '<path d="' + d + '" stroke="' + c + '" stroke-width="12" fill="none" opacity=".25" stroke-linecap="round" stroke-dasharray="0.1 14"/>' +
      '<path d="' + d + '" stroke="#f1ebff" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="0.1 14"/>';
    return '<path d="' + d + '" stroke="' + e + '" stroke-width="24" fill="none" stroke-linecap="round"/>' +
      '<path d="' + d + '" stroke="' + c + '" stroke-width="18" fill="none" stroke-linecap="round"/>' +
      (b.name === 'Snowy peaks' ? '<path d="' + d + '" stroke="#c9d8f2" stroke-width="5" fill="none" stroke-dasharray="3 9" stroke-linecap="round"/>' : '');
  }

  // ---------- the eight scenes ----------
  function meadow(sc) {
    let s = sky('s1', '#aee3ff', '#fff3cc', 230) +
      '<g class="rays" opacity=".35">' + [...Array(12)].map((_, i) => '<rect x="327" y="10" width="6" height="40" rx="3" fill="#fff6b0" transform="rotate(' + i * 30 + ' 330 80)"/>').join('') + '</g>' +
      '<circle cx="330" cy="80" r="44" fill="#fff4a8" opacity=".45"/><circle cx="330" cy="80" r="27" fill="#ffe066"/>' +
      S.cloud(250, 50, 0.9, '#fff', 0.9) + S.cloud(60, 190, 0.7, '#fff', 0.8) +
      S.hills(205, 10, '#bfe8b0', 11, { freq: 0.8 }) + S.hills(228, 12, '#a6dd95', 12, { freq: 1.2 }) +
      S.hills(265, 14, '#8fd47f', 13) + S.hills(420, 18, '#80ca70', 14) + S.hills(600, 18, '#72be64', 15) + S.hills(780, 16, '#66b259', 16) +
      '<ellipse cx="310" cy="790" rx="70" ry="24" fill="#5aa8c9"/><ellipse cx="310" cy="786" rx="66" ry="20" fill="#83d4f2"/>' +
      '<ellipse cx="290" cy="784" rx="9" ry="4" fill="#4fae5c"/><ellipse cx="330" cy="792" rx="7" ry="3" fill="#4fae5c"/><circle cx="292" cy="783" r="2" fill="#ff8fbf"/>';
    sc.add(9, [10, 250, 380, 860], 34, 50, (x, y, r) => r() < 0.55 ? S.roundTree(x, y, 0.8 + r() * 0.5, '#ffb7d5', '#f08cb8', { dots: '#fff' }) : S.roundTree(x, y, 0.8 + r() * 0.5, '#5cbf5f', '#43a14b', { dots: r() < 0.4 ? '#ff6b6b' : null }));
    sc.add(8, [10, 260, 380, 880], 26, 30, (x, y, r) => S.bush(x, y, 0.9 + r() * 0.4, '#56b85a', '#3e9a47', r() < 0.5 ? '#fff' : null));
    sc.add(55, [5, 250, 385, 895], 16, 9, (x, y, r) => S.flower(x, y, ['#fff', '#ffd23f', '#ff8fbf', '#b49bff'][Math.floor(r() * 4)]));
    sc.add(20, [5, 250, 385, 895], 14, 12, (x, y, r) => S.tuft(x, y, '#4fa64f', 0.8 + r() * 0.5));
    return s;
  }

  function pinelake(sc) {
    let s = sky('s2', '#d7f2ed', '#a9dcd3', 230) + '<circle cx="320" cy="72" r="24" fill="#fff" opacity=".65"/>' +
      S.mountain(60, 230, 200, 110, '#a6d6cc', '#95cbc0') + S.mountain(210, 230, 240, 150, '#9bd0c5', '#8ac4b8') + S.mountain(360, 230, 200, 100, '#a6d6cc', '#95cbc0') +
      S.hills(232, 6, '#86c8b8', 21) + S.hills(380, 12, '#73b9a8', 22) + S.hills(560, 15, '#65ad9b', 23) + S.hills(760, 14, '#579f8d', 24) +
      '<path d="M-20 470 C40 440 150 455 175 520 C200 590 120 640 40 630 C0 625 -20 600 -20 600Z" fill="#5fa9b9"/>' +
      '<path d="M-20 476 C40 448 146 462 168 520 C190 584 118 630 40 622 C0 618 -20 596 -20 596Z" fill="#8fd3e2"/>' +
      [[30, 500], [90, 540], [50, 580], [120, 590]].map(([x, y]) => '<path d="M' + x + ' ' + y + ' h22" stroke="#c9eef5" stroke-width="2" stroke-linecap="round"/>').join('') +

  // ---------- build the world ----------
  const P = (x, y) => 'left:' + f(x / W * 100) + '%;top:' + f(y / H * 100) + '%';
  const LOCK = '<svg viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2zm2 0h6V7a3 3 0 0 0-6 0z"/></svg>';
  const buddyX = (x) => (x > 195 ? x - 92 : x + 92);
  const world = document.getElementById('world');
  world.innerHTML = BIOMES.map((b, ci) => {
    const ch = T.chapters[ci];
    const pts = [[b.inX, ci ? -10 : 150]].concat(b.stops);
    if (b.outX !== null) pts.push([b.outX, H + 10]);
    const cv = S.curve(pts);
    // keep scenery off the coins (and the START bubble / mascot by the next lesson)
    const boxes = [];
    b.stops.forEach(([x, y]) => boxes.push([x - 50, y - 50, x + 50, y + 40]));
    ch.lessons.forEach((l, i) => { if (l.state === 'current') { const [x, y] = b.stops[i]; boxes.push([x - 60, y - 110, x + 60, y], [buddyX(x) - 40, y - 80, buddyX(x) + 40, y + 10]); } });
    const sc = S.Scatter(100 + ci * 17, cv.samples, boxes);
    sc.samples = cv.samples;
    sc.density = 0.55;  // calmer scenery so the coins read first
    sc.pad = 16;        // and a clear lane around the trail
    const scene = b.draw(sc);
    const svg = '<svg class="bg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true"><defs>' +
      '<filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>' +
      '<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>' +
      scene + trailSvg(b, cv.d) + (sc.bridge || '') + sc.svg() + '</svg>';

    let html = svg + '<div class="fx">' + b.fx() + '</div>';
    ch.lessons.forEach((l, i) => {
      const [x, y] = b.stops[i];
      const inner = l.state === 'locked' ? LOCK : l.icon;
      html += '<div class="node ' + l.state + '" style="' + P(x, y) + '">' +
        (l.state === 'current' ? '<span class="ring"></span><span class="start">START</span>' : '') +
        '<button class="coin" data-i="' + l.i + '" aria-label="Lesson ' + l.num + ': ' + l.title + '">' + inner + '</button>' +
        (l.state === 'done' ? '<span class="badge">' + T.stars(l.stars) + '</span>' : '') + '</div>';
      if (l.state === 'current') html += '<div class="buddy" style="' + P(buddyX(x), y) + '"><div class="m">' + T.mascot({ mood: 'happy' }) + '</div></div>';
    });
    const [tx, ty] = b.stops[3];
    html += '<div class="node trophy ' + (ch.done ? 'done' : 'locked') + '" style="' + P(tx, ty) + '"><button class="coin" data-t="' + ci + '" aria-label="Chapter ' + ch.num + ' trophy"><span>' + (ch.done ? '🏆' : '🎁') + '</span></button></div>';
    if (b.seam) html += '<div class="seam">' + seam(b.seam, ci) + '</div>';
    if (b.outX === null) html += '<p class="finale">More chapters coming soon ✨</p>';
    return '<section class="biome" data-ci="' + ci + '" style="--ac:' + b.ac + ';--acd:' + shade(b.ac, 0.68) + ';--tx:' + b.tx + '">' + html + '</section>';
  }).join('');

  // a bank of soft clouds hides the jump from one biome to the next
  function seam(c, seed) {
    const r = T.rng(300 + seed);
    let s = '<svg viewBox="0 0 390 150" preserveAspectRatio="none"><defs><linearGradient id="sg' + seed + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + c + '" stop-opacity="0"/>' +
      '<stop offset=".35" stop-color="' + c + '" stop-opacity=".9"/><stop offset=".65" stop-color="' + c + '" stop-opacity=".9"/><stop offset="1" stop-color="' + c + '" stop-opacity="0"/></linearGradient></defs>' +
      '<rect width="390" height="150" fill="url(#sg' + seed + ')"/>';
    for (let x = -20; x < 420; x += 26 + r() * 18) s += '<circle cx="' + f(x) + '" cy="' + f(62 + r() * 26) + '" r="' + f(20 + r() * 18) + '" fill="' + c + '" opacity="' + f(0.75 + r() * 0.25) + '"/>';
    return s + '</svg>';
  }

      '<div class="dots">' + ch.lessons.map((l) => '<i class="' + (l.state === 'done' ? 'on' : '') + '"></i>').join('') + '</div></div>' +
      '<button class="guide"><span>📖</span>Guide</button>';
  }
  function onScroll() {
    const mid = innerHeight * 0.45;
    let ci = 0;
    secs.forEach((s, i) => { if (s.getBoundingClientRect().top < mid) ci = i; });
    setBanner(ci);
    const r = cur.getBoundingClientRect();
    const out = r.bottom < 110 || r.top > innerHeight - 110;
    jump.classList.toggle('hide', !out);
    jump.classList.toggle('up', r.bottom < 110);
  }
  addEventListener('scroll', onScroll, { passive: true });

  // tap a coin → a card drops down right under it
  const pop = document.createElement('div');
  pop.className = 'pop';
  let popFor = null;
  function closePop() { pop.classList.remove('on'); popFor = null; }
  world.addEventListener('click', (e) => {
    const btn = e.target.closest('.coin');
    if (!btn) return;
    e.stopPropagation();
    if (popFor === btn) return closePop();
    popFor = btn;
    const sec = btn.closest('.biome'), node = btn.closest('.node');
    let html, locked;
    if (btn.dataset.t !== undefined) {
      const ch = T.chapters[+btn.dataset.t];
      locked = !ch.done;
      html = '<span class="ic">' + (ch.done ? '🏆' : '🎁') + '</span><div class="k">Chapter ' + ch.num + ' · ' + BIOMES[ch.ci].name + '</div><h3>' + (ch.done ? 'Trophy won!' : 'A gift waits here') + '</h3>' +
        '<div class="row">' + (ch.done ? T.stars(3) + ' ' + ch.starCount + ' of 9 stars · +50 XP' : 'Finish the three lessons to open it') + '</div>' +
        '<button class="go">' + (ch.done ? 'REPLAY CHAPTER' : 'LOCKED') + '</button>';
    } else {
      const l = T.lessons[+btn.dataset.i];
      locked = l.state === 'locked';
      const why = T.chapters[l.ci].open ? 'Finish the lesson before to unlock' : 'Finish chapter ' + l.ci + ' to unlock';
      html = '<span class="ic">' + l.icon + '</span><div class="k">Lesson ' + l.num + ' · ' + l.mins + ' min</div><h3>' + l.title + '</h3>' +
        '<div class="row">' + (l.state === 'done' ? T.stars(l.stars, locked ? 'dark' : '') + ' Best ' + l.stars + ' of 3' : locked ? why : '5 questions · no timer') + '</div>' +
        '<button class="go">' + (l.state === 'done' ? 'PRACTISE AGAIN' : locked ? 'LOCKED' : 'START +15 XP') + '</button>';
    }
    pop.className = 'pop' + (locked ? ' locked' : '');
    pop.innerHTML = html;
    sec.appendChild(pop);
    const sr = sec.getBoundingClientRect(), nr = node.getBoundingClientRect();
    const w = pop.offsetWidth;
    const cx = nr.left + nr.width / 2 - sr.left;
    const left = Math.max(16 + w / 2, Math.min(sr.width - 16 - w / 2, cx));
    pop.style.left = left + 'px';
    pop.style.top = (nr.bottom - sr.top + 16) + 'px';
    pop.style.setProperty('--ax', (w / 2 + (cx - left)) + 'px');
    void pop.offsetWidth;
    pop.classList.add('on');
    // make sure the whole card is on screen
    const pb = nr.bottom + 16 + pop.offsetHeight + 100;
    if (pb > innerHeight) scrollBy({ top: pb - innerHeight, behavior: 'smooth' });
  });
  document.addEventListener('click', (e) => { if (!pop.contains(e.target)) closePop(); });

  const cur = document.querySelector('.node.current');
  jump.onclick = (e) => { e.stopPropagation(); cur.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
  const land = () => { cur.scrollIntoView({ block: 'center' }); onScroll(); };
  land();
  addEventListener('load', land);
})();
</script>
</body>
</html>

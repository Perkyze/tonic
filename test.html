<!doctype html>
<meta charset="utf-8">
<title>Tonic — generator fuzz test</title>
<pre id="out">running…</pre>
<script src="js/theory.js"></script>
<script src="js/guitar.js"></script>
<script src="js/questions.js"></script>
<script src="js/lessons.js"></script>
<script src="js/deepcut.js"></script>
<script>
/* Runs every generator thousands of times and checks the questions are well formed:
   one correct answer, no duplicate options, clean spellings, sane audio. */
(function () {
  const T = Theory, Q = Questions;
  // test.html?naming=both (or fr) runs everything with that note-name setting
  const naming = new URLSearchParams(location.search).get('naming') || 'en';
  T.setNaming(naming);
  const errs = [], stats = {};
  const fail = (id, d, msg, q) => { if (errs.length < 60) errs.push(`${id} d${d}: ${msg}` + (q ? ' | ' + q.prompt + ' -> ' + q.answerText : '')); };
  let total = 0;
  Q.GENS.forEach((g) => {
    for (let d = g.min; d <= g.max; d++) {
      const keys = new Set();
      for (let i = 0; i < 400; i++) {
        const rng = T.makeRng(g.id + ':' + d + ':' + i);
        let q;
        try { q = Q.make(g, rng, d); } catch (e) { fail(g.id, d, 'threw ' + e.message); continue; }
        total++;
        keys.add(q.key);
        if (!q.prompt || !q.explain || !q.answerText || !q.key) fail(g.id, d, 'missing field', q);
        if (/undefined|NaN|null/.test(q.prompt + q.explain + q.answerText + (q.sub || ''))) fail(g.id, d, 'bad text: ' + q.explain, q);
        if (/[{}]/.test(q.prompt + q.explain + q.answerText + (q.sub || '') + (q.hint || ''))) fail(g.id, d, 'unconverted note token: ' + q.explain + ' / ' + q.hint, q);
        const inp = q.input;
        if (inp.kind === 'choice') {
          const labels = inp.options.map((o) => o.label);
          if (new Set(labels).size !== labels.length) fail(g.id, d, 'duplicate options ' + labels.join(' / '), q);
          if (inp.answer < 0 || inp.answer >= labels.length) fail(g.id, d, 'bad answer index', q);
          if (labels.length < 2) fail(g.id, d, 'too few options', q);
          if (inp.layout !== 'letters' && labels.length < 3 && !(g.id === 'ear-chord' || g.id === 'ear-scale')) fail(g.id, d, 'only ' + labels.length + ' options', q);
          if (labels.some((l) => /undefined|NaN/.test(l) || !l)) fail(g.id, d, 'bad label ' + labels.join(' / '), q);
          if (g.id !== 'chord-formula' && labels.some((l) => /♯♯|♭♭|×/.test(l))) fail(g.id, d, 'double accidental in options ' + labels.join(' / '), q);
        } else if (inp.kind === 'fret') {
          if (!Guitar.positions(inp.targetPc, 0, inp.to).length) fail(g.id, d, 'note not reachable', q);
        } else {
          if (inp.exact) { if (!inp.targetMidis.every((m) => m >= inp.lo && m <= inp.hi)) fail(g.id, d, 'target off keyboard', q); }
          else if (new Set(inp.targetPcs).size !== inp.targetPcs.length) fail(g.id, d, 'dup target pcs', q);
        }
        if (!q.hint) fail(g.id, d, 'no hint', q);
        [q.visual, q.reveal].forEach((v) => {
          if (v && v.kind === 'fretboard') (v.dots || []).forEach((dd) => { if (dd.f !== 0 && (dd.f < v.from || dd.f > v.to)) fail(g.id, d, 'dot off fretboard', q); });
        });
        const evs = (q.audio || []).concat(q.audioAfter || []);
        evs.forEach((ev) => ev.midis.forEach((m) => { if (!(m >= 33 && m <= 96)) fail(g.id, d, 'midi out of range ' + m, q); }));
        [q.visual, q.reveal].forEach((v) => {
          if (v && v.kind === 'piano') {
            if (v.lo % 12 !== 0 || v.hi % 12 !== 11) fail(g.id, d, 'piano range not C..B', q);
            (v.marks || []).forEach((m) => { if (m < v.lo || m > v.hi) fail(g.id, d, 'mark off keyboard', q); });
          }
        });
      }
      stats[g.id + ' d' + d] = keys.size;
    }
  });
  // dailies
  let dailies = 0;
  ['beginner', 'intermediate', 'advanced'].forEach((tier) => {
    for (let day = 1; day <= 120; day++) {
      const ds = '2027-' + String(1 + (day % 12)).padStart(2, '0') + '-' + String(1 + (day % 28)).padStart(2, '0');
      try {
        const qs = Q.daily(ds, tier);
        if (qs.length !== 8) fail('daily', tier, 'length ' + qs.length);
        if (qs.filter((q) => q.skill === 'guitar').length > 1) fail('daily', tier, 'more than one guitar question');
        if (new Set(qs.map((q) => q.gen)).size < 7) fail('daily', tier, 'repeated generators: ' + qs.map((q) => q.gen).join(','));
        const again = Q.daily(ds, tier);
        if (JSON.stringify(again.map((q) => q.key + q.answerText)) !== JSON.stringify(qs.map((q) => q.key + q.answerText))) fail('daily', tier, 'not deterministic');
        const dc = DeepCut.make(T.makeRng('dc:' + ds + ':' + tier), tier);
        if (dc.answers.length < 6) fail('deepcut', tier, 'few answers');
        if (new Set(dc.answers.map((a) => a.label)).size !== dc.answers.length) fail('deepcut', tier, 'dup labels');
        dailies++;
      } catch (e) { fail('daily', tier, 'threw ' + e.message + ' ' + (e.stack || '').split('\n')[1]); }
    }
  });
  // guitar shapes must contain exactly the notes of the chord they claim to be
  Guitar.SHAPES.forEach((sh) => {
    const want = new Set(T.chordPcs(sh.rootPc, sh.q));
    const got = new Set(sh.frets.map((f, s) => (f < 0 ? null : Guitar.pcAt(s, f))).filter((x) => x !== null));
    if (want.size !== got.size || [...want].some((p) => !got.has(p))) fail('guitar-shape', 0, sh.id + ' plays the wrong notes');
    const lowest = sh.frets.findIndex((f) => f >= 0);
    if (Guitar.pcAt(lowest, sh.frets[lowest]) !== sh.rootPc) fail('guitar-shape', 0, sh.id + ' does not have its root in the bass');
  });
  // lessons: every quiz builds, every card's picture is in range
  let lessonQs = 0;
  Lessons.LESSONS.forEach((les) => {
    for (let i = 0; i < 60; i++) {
      try {
        const qs = Q.lessonQuiz(T.makeRng(les.id + i), les.quiz);
        if (qs.length !== 5) fail('lesson', 0, les.id + ' quiz has ' + qs.length + ' questions');
        lessonQs += qs.length;
      } catch (e) { fail('lesson', 0, les.id + ' quiz threw ' + e.message); }
    }
    les.cards.forEach((c, i) => {
      if (!c.h || !c.p) fail('lesson', 0, les.id + ' card ' + i + ' missing text');
      const words = [les.title, les.blurb, c.h, c.p, c.al || '', (c.v && c.v.big) || ''].concat(c.v && c.v.items ? c.v.items.map((it) => it.cap || '') : []).join(' ');
      if (/[{}]/.test(words)) fail('lesson', 0, les.id + ' card ' + i + ' unconverted note token: ' + words);
      const vs = !c.v ? [] : c.v.kind === 'row' ? c.v.items.map((it) => it.v) : [c.v];
      vs.forEach((v) => {
        if (v.kind === 'piano') v.marks.forEach((m) => { if (m < v.lo || m > v.hi) fail('lesson', 0, les.id + ' card ' + i + ' mark off keyboard'); });
        if (v.kind === 'fretboard') (v.dots || []).forEach((dd) => { if (dd.f !== 0 && (dd.f < v.from || dd.f > v.to)) fail('lesson', 0, les.id + ' card ' + i + ' dot off fretboard'); });
      });
      (c.a || []).forEach((ev) => ev.midis.forEach((m) => { if (!(m >= 33 && m <= 96)) fail('lesson', 0, les.id + ' card ' + i + ' midi ' + m); }));
    });
  });
  // with guitar switched off, no guitar question may reach the daily set
  Q.setGuitar(false);
  for (let day = 1; day <= 60; day++) ['beginner', 'intermediate', 'advanced'].forEach((tier) => {
    if (Q.daily('2028-01-' + day, tier).some((q) => q.skill === 'guitar')) fail('daily', tier, 'guitar question while guitar is off');
  });
  Q.setGuitar(true);
  // The note-name setting changes wording only: the same seed must give the same question,
  // the same answer and the same number of options in every setting.
  let crossChecked = 0;
  const answerShape = (q) => JSON.stringify([q.key, q.input.kind, q.input.answer, (q.input.options || []).length, q.input.targetPcs, q.input.targetMidis, q.input.targetPc,
    (q.input.options || []).map((o) => !!o.audio), q.audio, q.audioAfter]);
  Q.GENS.forEach((g) => {
    for (let d = g.min; d <= g.max; d++) {
      for (let i = 0; i < 80; i++) {
        const seed = 'x:' + g.id + ':' + d + ':' + i;
        const shapes = T.NAMINGS.map((nmode) => { T.setNaming(nmode); return answerShape(Q.make(g, T.makeRng(seed), d)); });
        if (shapes.some((s) => s !== shapes[0])) fail(g.id, d, 'question differs between note-name settings');
        crossChecked++;
      }
    }
  });
  ['beginner', 'intermediate', 'advanced'].forEach((tier) => {
    const sets = T.NAMINGS.map((nmode) => { T.setNaming(nmode); return Q.daily('2027-03-14', tier).map(answerShape).join('|'); });
    if (sets.some((s) => s !== sets[0])) fail('daily', tier, 'daily set differs between note-name settings');
  });
  T.setNaming(naming);
  const out = { naming, total, dailies, lessonQs, crossChecked, shapes: Guitar.SHAPES.length, errors: errs, variety: stats };
  window.__fuzz = out;
  document.getElementById('out').textContent = JSON.stringify(out, null, 1);
})();
</script>
